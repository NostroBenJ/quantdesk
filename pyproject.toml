[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdesk"
version = "0.1.0"
description = "Modular trading research and execution system, honesty infrastructure first"
requires-python = ">=3.11"
# The core (types, clock, bars, backtest, metrics, walk-forward, lookahead guard)
# has NO third-party dependencies. Everything below is optional and imported
# inside the function that needs it, so `import quantdesk` works in a bare
# interpreter and the pricing/backtest maths stays legible.
dependencies = []

[project.optional-dependencies]
data = ["yfinance>=0.2", "pandas>=2.0"]
parquet = ["pandas>=2.0", "pyarrow>=14"]
config = ["PyYAML>=6.0"]
narrative = ["anthropic>=0.40"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["quantdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::RuntimeWarning"]
